## A basic GitHub Actions workflow for your Quarkus application.

name: CI build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Build & Test
        run: ./mvnw verify -B

      - name: Chips
        run: | 
            chmod +x test.sh
            ./test.sh
            echo "blabla"
  step2:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Echo Chips
        run: echo "Chips!"
  step3:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Echo Chips Again
        run: echo "Chips again!"