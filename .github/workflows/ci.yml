## A basic GitHub Actions workflow for your Quarkus application.

name: CI build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Build
        run: ./mvnw verify -B

      - name: Chips
        run: echo "Hello world"
  recette:
    runs-on: alpine
    steps: 
      - name: Prerequis
        run: echo "Etre super fort"
      - name: Etape1
        run: echo "Chips" >> test
      - name: Etape2 
        run: cat ./test

