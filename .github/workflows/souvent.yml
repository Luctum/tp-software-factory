name: Le job de 22h
on:
    schedule:
        - cron: 05 22 * * *    

jobs:
    create-issue:
        runs-on: ubuntu-latest
        permissions: write-all
        steps:
            - uses: actions/checkout@v3
            - uses: JasonEtco/create-an-issue@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                filename: .github/template.md